[project]
name = "startsit"
version = "0.1.0"
description = "Fantasy football start/sit assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
