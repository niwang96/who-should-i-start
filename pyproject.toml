[project]
name = "startsit"
version = "0.1.0"
description = "Fantasy football start/sit assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1.5",
    "polars>=1.0",
    "psycopg[binary]>=3.2",
    "defusedxml>=0.7",
    "tzdata>=2024.1",  # time zone data for zoneinfo where the OS has none
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests call real services and spend API quota; run them explicitly with `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: calls real external services (network and API quota)"]

[tool.coverage.run]
source = ["startsit"]
branch = true

[tool.coverage.report]
# CI fails below this (unit + database tests only; live tests aren't counted).
fail_under = 95
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["nflreadpy.*", "defusedxml.*"]
ignore_missing_imports = true
