name: tests

on:
  # main after merges, and every pull request (pushes to PR branches would otherwise run twice).
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # Disposable Postgres so the data-access layer is tested against the same engine as Supabase.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: startsit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      STARTSIT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/startsit_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e '.[dev,ingest]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q --cov --cov-report=term
