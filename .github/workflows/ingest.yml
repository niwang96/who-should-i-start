name: ingest

on:
  schedule:
    # Daily full run: nflverse publishes stats/snaps in batches after games, so a daily
    # full-season refresh picks up each update within a day. It also archives that day's
    # FantasyPros weekly rankings scrape and runs the news step.
    - cron: "17 10 * * *"
    # News only, hourly: headlines go stale fast, and RotoWire's feed only lists its latest 5.
    # Each run makes ~1 LLM call (40 headlines per call), within the 40/day news budget.
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Which part to run"
        type: choice
        options: [all, stats, news]
        default: all
      season:
        description: "Season to ingest (default: current)"
        required: false

# Never run two ingests at once against the same database.
concurrency: ingest

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Supabase when the secret is set; otherwise a fresh SQLite file uploaded as an artifact.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Without it, news items are stored but not extracted.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      STARTSIT_DB_PATH: data/startsit.db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - name: Ingest
        env:
          SEASON: ${{ inputs.season }}
          ONLY: ${{ github.event.schedule == '47 * * * *' && 'news' || inputs.only }}
        run: |
          [ "$ONLY" = all ] && ONLY=""
          python -m startsit.ingest ${ONLY:+--only "$ONLY"} ${SEASON:+--season "$SEASON"}
      - name: Summarize
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          from startsit.db import Database
          with Database() as db:
              print(f"Database: {'Postgres' if db.is_postgres else 'SQLite'}\n")
              print("| source | season | max week | rows |\n|---|---|---|---|")
              for r in db.recent_runs(12):
                  print(f"| {r['source']} | {r['season']} | {r['max_week']} | {r['row_count']} |")
          PY
      # Without Supabase, keep the SQLite file as an artifact. Each run is a full-season
      # refresh, but rankings history only accumulates in a persistent database.
      - if: ${{ env.DATABASE_URL == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: startsit-db
          path: data/startsit.db
          retention-days: 7
