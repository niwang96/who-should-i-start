name: ingest

on:
  schedule:
    # Daily full run: nflverse publishes stats/snaps in batches after games, so a daily
    # full-season refresh picks up each update within a day. It also archives that day's
    # FantasyPros weekly rankings scrape and runs the news step.
    - cron: "17 10 * * *"
    # News, hourly: fetch feeds, extract new headlines (~1 LLM call), re-check the rankings file.
    - cron: "47 * * * *"
    # Fetch feeds only (no LLM), every 15 minutes at peak times, because RotoWire's feed only
    # lists its latest 5 items. The next hourly run extracts what these store. Times are UTC:
    # Sunday games through Sunday night, and Thursday/Monday night games (~100 runs/week; Actions
    # minutes are free for public repos).
    - cron: "*/15 16-23 * * 0"
    - cron: "*/15 0-4 * * 1"
    - cron: "*/15 22-23 * * 1,4"
    - cron: "*/15 0-3 * * 2,5"
  workflow_dispatch:
    inputs:
      only:
        description: "Which part to run"
        type: choice
        options: [all, stats, news, news-fetch]
        default: all
      season:
        description: "Season to ingest (default: current)"
        required: false

# Never run two ingests at once against the same database.
concurrency: ingest

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Supabase when the secret is set; otherwise a fresh SQLite file uploaded as an artifact.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Without it, news items are stored but not extracted.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Without it, the daily run skips FantasyPros projections.
      FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
      STARTSIT_DB_PATH: data/startsit.db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e '.[ingest]'
      - name: Ingest
        env:
          SEASON: ${{ inputs.season }}
          # Manual runs use the chosen input; scheduled runs map their schedule to a mode.
          ONLY: >-
            ${{ github.event_name != 'schedule' && inputs.only
            || github.event.schedule == '17 10 * * *' && 'all'
            || github.event.schedule == '47 * * * *' && 'news'
            || 'news-fetch' }}
        run: |
          [ "$ONLY" = all ] && ONLY=""
          python -m startsit.ingest ${ONLY:+--only "$ONLY"} ${SEASON:+--season "$SEASON"}
      - name: Summarize
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          from startsit.db import Database
          with Database() as db:
              print(f"Database: {'Postgres' if db.is_postgres else 'SQLite'}\n")
              print("| source | season | max week | rows |\n|---|---|---|---|")
              for r in db.recent_runs(12):
                  print(f"| {r['source']} | {r['season']} | {r['max_week']} | {r['row_count']} |")
          PY
      # Without Supabase, keep the SQLite file as an artifact. Each run is a full-season
      # refresh, but rankings history only accumulates in a persistent database.
      - if: ${{ env.DATABASE_URL == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: startsit-db
          path: data/startsit.db
          retention-days: 7
