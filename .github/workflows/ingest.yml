name: ingest

# Every scheduled run is a news run: fetch feeds, extract new headlines (~1 LLM call when
# there are new items), re-check the rankings file, and, once a day after 10:00 UTC, the full
# stats refresh (nflverse, rankings, FantasyPros projections). GitHub delays or drops
# scheduled runs when busy, so the daily refresh isn't tied to one run: whichever run comes
# first after 10:00 UTC does it. Times are UTC and cover both US daylight and standard time.
# Minutes avoid :00, when GitHub's queue is busiest.
on:
  schedule:
    - cron: "17 10 * * *"  # the usual daily refresh
    - cron: "47 * * * *"  # hourly news
    # Sunday mornings, when inactives and game-time decisions come out and lineups are set:
    # every 30 minutes, ~8am to 1:30pm US Eastern, then twice before the 4pm games.
    - cron: "7,37 12-18 * * 0"
    - cron: "17 19,20 * * 0"
    # Before Thursday and Monday night games (8:15pm Eastern): ~7pm and ~7:45pm Eastern.
    - cron: "2,42 23 * * 1,4"
    - cron: "2,42 0 * * 2,5"
  workflow_dispatch:
    inputs:
      only:
        description: "Which part to run"
        type: choice
        options: [all, stats, news, news-fetch]
        default: all
      season:
        description: "Season to ingest (default: current)"
        required: false

# Never run two ingests at once against the same database.
concurrency: ingest

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Supabase when the secret is set; otherwise a fresh SQLite file uploaded as an artifact.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Without it, news items are stored but not extracted.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Without it, the daily run skips FantasyPros projections.
      FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
      STARTSIT_DB_PATH: data/startsit.db
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e '.[ingest]'
      - name: Ingest
        env:
          SEASON: ${{ inputs.season }}
          # Manual runs use the chosen input; scheduled runs are news runs (see the top).
          ONLY: ${{ github.event_name == 'schedule' && 'news' || inputs.only }}
        run: |
          [ "$ONLY" = all ] && ONLY=""
          python -m startsit.ingest ${ONLY:+--only "$ONLY"} ${SEASON:+--season "$SEASON"}
      - name: Summarize
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          from startsit.db import Database
          with Database() as db:
              print(f"Database: {'Postgres' if db.is_postgres else 'SQLite'}\n")
              print("| source | season | max week | rows |\n|---|---|---|---|")
              for r in db.recent_runs(12):
                  print(f"| {r['source']} | {r['season']} | {r['max_week']} | {r['row_count']} |")
          PY
      # Without Supabase, keep the SQLite file as an artifact. Each run is a full-season
      # refresh, but rankings history only accumulates in a persistent database.
      - if: ${{ env.DATABASE_URL == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: startsit-db
          path: data/startsit.db
          retention-days: 7
